<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cold Bore" />
    <meta
      name="description"
      content="Choose a rifle, read the wind, dial the turrets and break the shot. A precision rifle trainer with real ballistics."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Cold Bore — precision rifle trainer</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0d1210;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1210;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #8b998f;
        letter-spacing: 0.42em;
        font-size: 11px;
        background:
          radial-gradient(ellipse at 50% 40%, rgba(18, 28, 22, 0.9) 0%, #080b0a 70%),
          #080b0a;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="boot">COLD BORE</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
